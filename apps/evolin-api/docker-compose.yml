name: evolin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: UTC
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
