appId: com.polovec.tempo
productName: Tempo
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/sql.js/**"
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
mac:
  icon: icon.png
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - dir
  category: public.app-category.productivity
  extendInfo:
    NSMicrophoneUsageDescription: Tempo uses the microphone to dictate what you will work on this session.
    NSSpeechRecognitionUsageDescription: Tempo uses speech recognition to fill session scope from dictation.
